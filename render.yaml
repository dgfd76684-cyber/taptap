services:
  - type: web
    name: tap-necklace
    runtime: python
    plan: starter
    buildCommand: ""
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        value: /var/data/tap_necklace.sqlite3
    disk:
      name: tap-necklace-data
      mountPath: /var/data
      sizeGB: 1
